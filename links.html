<!doctype html>

<html long="en">

<head>
    <meta charset="utf-8">
    <title>Links page</title>
    <style>
        a {
            color: rgba(157, 205, 112, 0.607);
            text-decoration: overline;
            display: block;
            width: 150px;
            height: 50px;
            border-radius: 20px;
            background: rgb(148, 132, 135);
            border: 1px rbg(255, 209, 136) padding:10px;
            text-align: center;
            box-shadow: 5px 5px 0px;
        }

        a:hover {
            color: green;
            text-decoration: overline;
            font-weight: 900;
        }

        a:active {
            background: rgb(21, 54, 65);
        }

        .two {
            background: rgb(41, 77, 101);
            border-radius: 0;
        }

        .two:hover {
            background: rgb(93, 102, 68);
        }
    </style>

    <head>


    <body>
        <p><a href="#one">link text</a></p>
        <p><a class="two" href="#">link text</a></p>
        <p><a class="three" href="#">link text</a></p>
        <p><a class="four" href="#">link text</a></p>
    </body>





    </body>

</html>
